stages:
  - build
  - push
  - deploy

variables:
  DOCKER_USERNAME: "DOCKER_USERNAME"
  DOCKER_PASSWORD: "DOCKER_PASSWORD"

 
before_script:
  - echo "$DOCKER_PASSWORD" | docker login -u $DOCKER_USERNAME --password-stdin  

build_images:
  stage: build
  image: docker:cli 
  services:
    - docker:dind 
  script:
    - echo "===bulding image using docker compose==="
    - docker compose build 
    - echo "===tag nginx images==="
    - docker tag "$DOCKER_USERNAME/nginx"  "$DOCKER_USERNAME":$CI_PIPELINE_IID
    - echo "===tag flask images==="   
    - docker tag "$DOCKER_USERNAME/flask"  "$DOCKER_USERNAME":$CI_PIPELINE_IID
    - echo "===saving images to tar archive==="
    - docker save -o nginx-image.tar "$DOCKER_USERNAME":$CI_PIPELINE_IID
    - docker save -o flask-image.tar "$DOCKER_USERNAME":$CI_PIPELINE_IID

  artifacts:
    expire_in: 1 day
    paths:
      - nginx-image.tar
      - flask-image.tar




push_images:
  stage: push
  image: docker:cli
  script:
    - echo "Pushing images to Docker Hub..."
    - docker load -i nginx-image.tar
    - docker load -i flask-image.tar
    - docker push "$DOCKER_USERNAME":$CI_PIPELINE_IID
    - docker push "$DOCKER_USERNAME":$CI_PIPELINE_IID


    

