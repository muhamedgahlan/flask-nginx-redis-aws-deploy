stages:
  - build
  - push
  - deploy

variables:
  DOCKER_USERNAME: "DOCKER_USERNAME"
  DOCKER_PASSWORD: "DOCKER_PASSWORD"
  EC2_USER: "user"
  IP: "EC2_IP"
  ssh_key: "my_key"

 
before_script:
  - echo "$DOCKER_PASSWORD" | docker login -u $DOCKER_USERNAME --password-stdin  

build_images:
  stage: build
  image: docker:cli 
  services:
    - docker:dind 
  script:
    - echo "===bulding image using docker compose==="
    - docker compose build 
    - echo "===tag nginx images==="
    - docker tag "$DOCKER_USERNAME/nginx"  "$DOCKER_USERNAME"/nginx:$CI_PIPELINE_IID
    - echo "===tag flask images==="   
    - docker tag "$DOCKER_USERNAME/flask"  "$DOCKER_USERNAME"/flask:$CI_PIPELINE_IID
    - echo "===saving images to tar archive==="
    - docker save -o nginx-image.tar "$DOCKER_USERNAME"/nginx:$CI_PIPELINE_IID
    - docker save -o flask-image.tar "$DOCKER_USERNAME"/flask:$CI_PIPELINE_IID

  artifacts:
    expire_in: 1 day
    paths:
      - nginx-image.tar
      - flask-image.tar


push_images:
  stage: push
  image: docker:cli
  services:
    - docker:dind
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u $DOCKER_USERNAME --password-stdin
  script:
    - echo "loading images..."
    - docker load -i nginx-image.tar
    - docker load -i flask-image.tar
    - echo "Pushing images to Docker Hub..."
    - docker push "$DOCKER_USERNAME"/nginx:$CI_PIPELINE_IID
    - docker push "$DOCKER_USERNAME"/flask:$CI_PIPELINE_IID


    

deploy_to_EC2:
  stage: deploy
  image: alpine:latest 
  before_script:
    - apk add --no-cache openssh-clinet 
    - eval $(ssh-agent -s) 
    - chmod 400 "$ssh_key"
    - ssh-add "$ssh_key" 
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$IP" >> ~/.ssh/~/.ssh/known_hosts
  script:
    - ssh $EC2_USER@$IP "cd /home/ec2-user/3-tier-docker-application" && docker compose pull && docker compose up -d"
    
 