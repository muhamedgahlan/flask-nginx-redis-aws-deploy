version: '3.8'

services:
  

  build_nginx:
    build: ./nginx
    image: mohamed7444/nginx
    container_name: nginx_proxy
    ports:
      - 8080:80
    networks:
      - app-net
    depends_on:
      - python_app

  python_app: 
    build: ./app
    container_name: web_container
    networks:
      - app-net
    depends_on:
      - redis_db 
    

  redis_db:
    image: redis:alpine
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
    
    